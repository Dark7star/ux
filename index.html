<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgilLink Prototype Access</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #233248;
      background: #f3f6fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 390px);
      padding: 36px;
      border: 1px solid #dce4ee;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 26px rgb(35 50 72 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      color: #304d6c;
      font-size: 22px;
    }

    p {
      margin: 0 0 24px;
      color: #66788d;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #bdc9d7;
      border-radius: 5px;
      font: inherit;
      letter-spacing: 0.2em;
    }

    input:focus {
      border-color: #2477bd;
      outline: 2px solid rgb(36 119 189 / 20%);
    }

    button {
      width: 100%;
      height: 44px;
      margin-top: 16px;
      border: 0;
      border-radius: 5px;
      background: #1976c9;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #145f9f;
    }

    [role="alert"] {
      min-height: 20px;
      margin: 10px 0 0;
      color: #b42318;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>AgilLink Prototype</h1>
    <p>Enter the access code provided by your testing facilitator to continue.</p>
    <form id="accessForm">
      <label for="accessCode">4-digit access code</label>
      <input
        id="accessCode"
        name="accessCode"
        type="password"
        inputmode="numeric"
        pattern="[0-9]{4}"
        maxlength="4"
        autocomplete="one-time-code"
        aria-describedby="codeError"
        required
      >
      <p id="codeError" role="alert" aria-live="polite"></p>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script>
    const accessForm = document.querySelector("#accessForm");
    const accessCode = document.querySelector("#accessCode");
    const codeError = document.querySelector("#codeError");

    accessForm.addEventListener("submit", (event) => {
      event.preventDefault();
      codeError.textContent = "";

      if (!/^\d{4}$/.test(accessCode.value)) {
        codeError.textContent = "Enter the 4-digit access code.";
        accessCode.focus();
        return;
      }

      if (accessCode.value !== "8879") {
        codeError.textContent = "That code doesn’t match. Please try again.";
        accessCode.value = "";
        accessCode.focus();
        return;
      }

      window.location.href = "approval-workbench.html";
    });
  </script>
</body>
</html>
